[workspace]
resolver = "2"
members = ["crates/core", "crates/egui-app", "crates/iced-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
# The typesetting engine. Pages are laid out by `typst`, rasterised by `typst-render`
# and exported by `typst-pdf`; `typst-kit` supplies the embedded and system fonts.
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts"] }
# The platform's data and cache directories, where `typst` keeps the packages it installed.
dirs = "6"
time = { version = "0.3", features = ["local-offset"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Assets, from crates rather than from a PdfCraft checkout: the official Lucide SVG icons
# (ISC) and the Inter / JetBrains Mono variable faces (OFL).
lucide-static-svg = "1.54"
damascene-fonts-inter = "0.1"
damascene-fonts-jetbrains-mono = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
